<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧园区管理系统 — 模块导航原型</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; background:#f0f2f5; height:100vh; display:flex; overflow:hidden; }

/* ====== 侧边栏 ====== */
.sidebar {
  width:220px; min-width:220px; height:100vh;
  background:linear-gradient(180deg, #1a2332 0%, #263445 100%);
  display:flex; flex-direction:column; color:#bfcbd9;
  transition:all 0.3s; overflow-y:auto; z-index:10;
}
.sidebar-logo {
  padding:18px 20px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.sidebar-logo .dot { width:10px; height:10px; border-radius:50%; background:#00d4ff; box-shadow:0 0 8px #00d4ff; }
.sidebar-logo h1 { font-size:14px; font-weight:600; color:#e0e6ed; white-space:nowrap; }
.sidebar-menu { flex:1; padding:10px 0; }
.menu-group { margin-bottom:6px; }
.menu-group-title { padding:8px 20px; font-size:11px; color:#6b7b8d; text-transform:uppercase; letter-spacing:1px; display:none; }
.menu-item {
  padding:10px 20px 10px 28px; font-size:13px; cursor:pointer;
  display:flex; align-items:center; gap:8px; transition:all 0.2s;
  color:#bfcbd9; position:relative;
}
.menu-item:hover { background:rgba(0,212,255,0.06); color:#e0e6ed; }
.menu-item.active { background:rgba(0,212,255,0.1); color:#00d4ff; }
.menu-item.active::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:#00d4ff; }
.menu-item .sub-icon { width:4px; height:4px; border-radius:50%; background:currentColor; opacity:0.5; }
.menu-back {
  padding:12px 20px; margin:8px 12px; border-radius:4px;
  font-size:12px; cursor:pointer; display:none; align-items:center; gap:6px;
  background:rgba(0,212,255,0.08); color:#00d4ff;
  transition:all 0.2s;
}
.menu-back:hover { background:rgba(0,212,255,0.15); }
.menu-back.show { display:flex; }

/* ====== 主内容区 ====== */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* 顶部条 */
.topbar { height:50px; min-height:50px; background:#fff; border-bottom:1px solid #e4e7ed; display:flex; align-items:center; padding:0 20px; gap:12px; }
.topbar-title { font-size:15px; font-weight:600; color:#303133; }

/* 内容区 */
.content { flex:1; overflow:auto; padding:20px; }
.content.portal { background:linear-gradient(135deg, #0a1628 0%, #162240 50%, #0d1f3c 100%); padding:30px 40px; }

/* ====== 门户型首页 ====== */
.portal-header { text-align:center; margin-bottom:30px; }
.portal-header h2 { font-size:22px; font-weight:300; color:rgba(255,255,255,0.5); letter-spacing:4px; margin-bottom:6px; }
.portal-header p { font-size:13px; color:rgba(255,255,255,0.3); letter-spacing:2px; }

.card-grid {
  display:grid; grid-template-columns:repeat(3, 1fr);
  gap:18px; max-width:1050px; margin:0 auto;
}
.module-card {
  position:relative; height:160px; border-radius:12px;
  cursor:pointer; overflow:hidden; transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
  display:flex; flex-direction:column; justify-content:flex-end; padding:20px;
  border:1px solid rgba(255,255,255,0.06);
}
.module-card:hover { transform:translateY(-4px); border-color:rgba(0,212,255,0.3); }
.module-card:hover .card-pattern { opacity:1; }

.card-pattern {
  position:absolute; inset:0; opacity:0.5;
  transition:opacity 0.35s;
}

.card-title {
  position:relative; z-index:1; font-size:17px; font-weight:600; color:#fff;
  letter-spacing:1px; margin-bottom:4px;
}
.card-sub {
  position:relative; z-index:1; font-size:11px; color:rgba(255,255,255,0.45);
  letter-spacing:1px;
}

/* ---- 各模块几何图案 ---- */
/* 人员管理：组织结构 = 同心圆 + 连接线 */
.card-pattern.p-staff {
  background:
    radial-gradient(circle at 75% 30%, rgba(0,212,255,0.3) 0%, transparent 12%),
    radial-gradient(circle at 75% 30%, rgba(0,212,255,0.15) 12%, transparent 24%),
    radial-gradient(circle at 75% 24%, rgba(0,212,255,0.2) 3px, transparent 3px),
    radial-gradient(circle at 82% 36%, rgba(0,212,255,0.2) 3px, transparent 3px),
    radial-gradient(circle at 68% 36%, rgba(0,212,255,0.2) 3px, transparent 3px),
    linear-gradient(135deg, rgba(64,158,255,0.15) 0%, rgba(0,212,255,0.05) 100%);
}
.card-pattern.p-staff::after {
  content:''; position:absolute; top:24%; left:68%; right:32%; bottom:70%;
  border:1px solid rgba(0,212,255,0.15); border-radius:50%;
}

/* 设备管理：电路板线条 */
.card-pattern.p-device {
  background:
    linear-gradient(0deg, transparent 48%, rgba(0,200,100,0.08) 48%, rgba(0,200,100,0.08) 49%, transparent 49%, transparent 51%, rgba(0,200,100,0.08) 51%, rgba(0,200,100,0.08) 52%, transparent 52%),
    linear-gradient(90deg, transparent 48%, rgba(0,200,100,0.1) 48%, rgba(0,200,100,0.1) 49%, transparent 49%, transparent 51%, rgba(0,200,100,0.1) 51%, rgba(0,200,100,0.1) 52%, transparent 52%),
    linear-gradient(135deg, rgba(0,200,100,0.12) 0%, rgba(0,160,80,0.04) 100%);
  background-size:30px 30px, 60px 60px, 100% 100%;
}
.card-pattern.p-device::before {
  content:''; position:absolute; top:20%; left:60%; right:20%; bottom:20%;
  border:1px solid rgba(0,200,100,0.08); border-radius:4px;
}
.card-pattern.p-device::after {
  content:''; position:absolute; top:40%; left:25%;
  width:50px; height:1px; background:rgba(0,200,100,0.2);
  box-shadow: 0 30px 0 rgba(0,200,100,0.1), 0 60px 0 rgba(0,200,100,0.06);
}

/* 智能化管理：雷达扫描 */
.card-pattern.p-smart {
  background:
    conic-gradient(from 0deg, rgba(255,145,0,0.12) 0deg, transparent 30deg),
    radial-gradient(circle at 70% 30%, rgba(255,145,0,0.08) 0%, transparent 50%),
    radial-gradient(circle at 70% 30%, transparent 35%, rgba(255,145,0,0.06) 35%, rgba(255,145,0,0.06) 36%, transparent 36%),
    linear-gradient(135deg, rgba(255,145,0,0.08) 0%, rgba(180,100,0,0.02) 100%);
}
.card-pattern.p-smart::after {
  content:''; position:absolute; top:20%; right:15%;
  width:60px; height:60px; border-radius:50%;
  border:1px solid rgba(255,145,0,0.2);
  box-shadow: 0 0 20px rgba(255,145,0,0.05);
}

/* 访客管理：通行闸机门 */
.card-pattern.p-visitor {
  background:
    linear-gradient(125deg, transparent 60%, rgba(64,158,255,0.08) 60%, rgba(64,158,255,0.08) 62%, transparent 62%),
    linear-gradient(125deg, transparent 62%, rgba(64,158,255,0.05) 62%, rgba(64,158,255,0.05) 64%, transparent 64%),
    linear-gradient(135deg, rgba(64,158,255,0.1) 0%, rgba(30,100,200,0.04) 100%);
}
.card-pattern.p-visitor::before {
  content:''; position:absolute; top:25%; bottom:25%; right:25%;
  width:3px; background:rgba(64,158,255,0.15);
  box-shadow: -15px 0 0 rgba(64,158,255,0.1), -30px 0 0 rgba(64,158,255,0.06), -45px 0 0 rgba(64,158,255,0.03);
}
.card-pattern.p-visitor::after {
  content:''; position:absolute; top:38%; left:15%; right:60%;
  height:2px; background:rgba(64,158,255,0.12);
}

/* 考勤管理：日历网格 */
.card-pattern.p-attendance {
  background:
    repeating-linear-gradient(0deg, transparent, transparent 13px, rgba(240,160,0,0.04) 13px, rgba(240,160,0,0.04) 14px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(240,160,0,0.04) 40px, rgba(240,160,0,0.04) 41px),
    linear-gradient(135deg, rgba(240,160,0,0.07) 0%, rgba(180,120,0,0.02) 100%);
}
.card-pattern.p-attendance::after {
  content:''; position:absolute; top:15%; left:50%; right:20%;
  height:2px; background:rgba(240,160,0,0.15);
  box-shadow:0 20px 0 rgba(240,160,0,0.08), 0 40px 0 rgba(240,160,0,0.05);
}

/* 系统监控：心电图波形 */
.card-pattern.p-monitor {
  background:
    linear-gradient(135deg, rgba(232,69,60,0.06) 0%, rgba(30,30,40,0) 100%);
}
.card-pattern.p-monitor::before {
  content:''; position:absolute; top:30%; left:10%; right:10%; height:1px;
  background:rgba(232,69,60,0.08);
}
.card-pattern.p-monitor::after {
  content:''; position:absolute; top:20%; left:15%; right:15%; bottom:60%;
  border-bottom:1px solid rgba(232,69,60,0.15);
  clip-path:polygon(
    0% 100%, 8% 80%, 10% 100%, 12% 80%, 14% 100%, 16% 30%, 18% 90%, 20% 100%,
    25% 90%, 28% 100%, 30% 80%, 32% 100%, 34% 20%, 36% 90%, 38% 100%,
    50% 95%, 55% 100%, 60% 70%, 62% 100%, 64% 85%, 66% 100%, 70% 40%, 72% 90%, 75% 100%,
    80% 85%, 85% 100%, 90% 75%, 92% 100%, 95% 85%, 100% 100%
  );
}

/* 短信中台：波纹扩散 */
.card-pattern.p-sms {
  background:
    radial-gradient(circle at 65% 28%, rgba(24,144,255,0.15) 0%, transparent 10%),
    radial-gradient(circle at 65% 28%, rgba(24,144,255,0.08) 10%, transparent 20%),
    radial-gradient(circle at 65% 28%, rgba(24,144,255,0.04) 20%, transparent 30%),
    linear-gradient(135deg, rgba(24,144,255,0.08) 0%, rgba(10,60,130,0.02) 100%);
}
.card-pattern.p-sms::after {
  content:''; position:absolute; top:25%; left:60%;
  width:8px;height:8px;border-radius:50%;background:rgba(24,144,255,0.3);
  box-shadow:0 0 12px rgba(24,144,255,0.2);
}

/* 会议管理：会议桌环形 */
.card-pattern.p-meeting {
  background:
    radial-gradient(ellipse 55% 60% at 55% 40%, transparent 30%, rgba(0,180,130,0.06) 30%, rgba(0,180,130,0.06) 32%, transparent 32%),
    radial-gradient(ellipse 40% 45% at 55% 40%, transparent 28%, rgba(0,180,130,0.04) 28%, rgba(0,180,130,0.04) 30%, transparent 30%),
    linear-gradient(135deg, rgba(0,180,130,0.07) 0%, rgba(0,100,80,0.02) 100%);
}
.card-pattern.p-meeting::after {
  content:''; position:absolute; top:28%; left:30%; right:40%; bottom:45%;
  border-radius:50%; border:1.5px solid rgba(0,180,130,0.15);
}

/* 系统管理：齿轮/嵌套方块（管理控制台） */
.card-pattern.p-admin {
  background:
    repeating-conic-gradient(rgba(84,112,198,0.06) 0% 2%, transparent 2% 8%) 50% 30% / 80px 80px,
    linear-gradient(135deg, rgba(84,112,198,0.1) 0%, rgba(40,60,130,0.03) 100%);
}
.card-pattern.p-admin::before {
  content:''; position:absolute; top:20%; left:30%; right:50%; bottom:30%;
  border:1.5px solid rgba(84,112,198,0.15); border-radius:3px;
  box-shadow: 8px 8px 0 rgba(84,112,198,0.08), 16px 16px 0 rgba(84,112,198,0.04);
}
.card-pattern.p-admin::after {
  content:''; position:absolute; top:18%; right:18%;
  width:30px; height:30px; border-radius:50%;
  border:2px solid rgba(84,112,198,0.12);
  border-top-color:transparent;
}

/* 通知公告：公告板/铃铛 */
.card-pattern.p-notice {
  background:
    repeating-linear-gradient(0deg, transparent, transparent 18px, rgba(250,200,88,0.03) 18px, rgba(250,200,88,0.03) 19px),
    linear-gradient(135deg, rgba(250,200,88,0.08) 0%, rgba(180,140,40,0.02) 100%);
}
.card-pattern.p-notice::before {
  content:''; position:absolute; top:18%; left:50%; right:25%; bottom:35%;
  border:1px solid rgba(250,200,88,0.1); border-radius:3px;
  background:linear-gradient(180deg, rgba(250,200,88,0.06) 0%, transparent 100%);
}
.card-pattern.p-notice::after {
  content:''; position:absolute; top:12%; left:58%;
  width:12px; height:12px; border-radius:50% 50% 0 0;
  border:1.5px solid rgba(250,200,88,0.2);
  border-bottom:none;
}

/* 公寓管理：建筑窗户网格 */
.card-pattern.p-hostel {
  background:
    repeating-linear-gradient(0deg, transparent, transparent 14px, rgba(160,120,200,0.04) 14px, rgba(160,120,200,0.04) 15px),
    repeating-linear-gradient(90deg, transparent, transparent 28px, rgba(160,120,200,0.04) 28px, rgba(160,120,200,0.04) 29px),
    linear-gradient(135deg, rgba(160,120,200,0.07) 0%, rgba(80,40,140,0.02) 100%);
}
.card-pattern.p-hostel::before {
  content:''; position:absolute; top:15%; left:15%; right:55%; bottom:30%;
  border:1px solid rgba(160,120,200,0.1);
  box-shadow: 40px 0 0 rgba(160,120,200,0.05), inset 0 20px 0 rgba(160,120,200,0.04);
}

/* ---- 模块内占位页 ---- */
.module-page { display:none; }
.module-page.active { display:block; }
.module-page h3 { font-size:18px; color:#303133; margin-bottom:8px; }
.module-page .breadcrumb { font-size:12px; color:#909399; margin-bottom:20px; }
.module-page .placeholder {
  background:#fff; border-radius:8px; padding:40px; text-align:center;
  color:#c0c4cc; border:1px dashed #dcdfe6; font-size:13px;
}

/* ---- 响应式 ---- */
@media (max-width:1100px) {
  .card-grid { grid-template-columns:repeat(3, 1fr); }
}
@media (max-width:700px) {
  .card-grid { grid-template-columns:repeat(2, 1fr); }
  .sidebar { width:180px; min-width:180px; }
}
</style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="dot"></span>
    <h1>智慧园区管理系统</h1>
  </div>
  <div class="menu-back show" id="backBtn" onclick="goHome()">← 返回首页</div>
  <nav class="sidebar-menu" id="sidebarMenu"></nav>
</aside>

<!-- 主内容 -->
<div class="main">
  <div class="topbar"><span class="topbar-title" id="topbarTitle">首页</span></div>
  <div class="content portal active" id="portal">
    <div class="portal-header">
      <h2>SMART PARK</h2>
      <p>智慧园区 · 综合管理平台</p>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </div>
  <div class="content" id="modulePage" style="display:none;">
    <h3 id="modTitle"></h3>
    <p class="breadcrumb" id="modBreadcrumb"></p>
    <div class="placeholder" id="modPlaceholder"></div>
  </div>
</div>

<script>
// ====== 模块数据 ======
const modules = [
  { id:1,    pid:1,    name:'系统管理',   path:'/system',     pattern:'p-admin',      color:'#5470c6', sub:'菜单 · 角色 · 用户 · 部门 · 岗位 · 参数' },
  { id:2000, pid:2000, name:'设备管理',   path:'/device',     pattern:'p-device',     color:'#00c864', sub:'IoT设备 · 拓扑 · 心跳 · 故障 · SNMP' },
  { id:2009, pid:2009, name:'智能化管理', path:'/smart',      pattern:'p-smart',      color:'#ff9100', sub:'门禁 · 车行 · 视频监控' },
  { id:2004, pid:2004, name:'访客管理',   path:'/visitor',    pattern:'p-visitor',    color:'#409EFF', sub:'预约 · 审批 · 登记 · 记录' },
  { id:2021, pid:2021, name:'考勤管理',   path:'/attendance', pattern:'p-attendance', color:'#f0a000', sub:'数据对接 · 考勤统计' },
  { id:2,    pid:2,    name:'系统监控',   path:'/monitor',    pattern:'p-monitor',    color:'#e8453c', sub:'操作日志 · 登录日志 · 数据监控 · 缓存' },
  { id:2132, pid:2132, name:'短信中台',   path:'/sms',        pattern:'p-sms',        color:'#1890ff', sub:'渠道 · 模板 · 业务 · 黑名单 · 日志' },
  { id:2031, pid:2031, name:'会议管理',   path:'/meeting',    pattern:'p-meeting',    color:'#00b482', sub:'会议室 · 预约 · 管理 · 审批' },
  { id:2113, pid:2113, name:'公寓管理',   path:'/hostel',     pattern:'p-hostel',     color:'#a078c8', sub:'房源 · 房间 · 卡片 · 租客' },
  { id:2100, pid:2100, name:'通知公告',   path:'/system/notice', pattern:'p-notice',  color:'#fac858', sub:'公告发布 · 消息推送' },
];

// 子菜单（模块内导航）
const subMenus = {
  1:    [{ name:'菜单管理', icon:'tree-table' },{ name:'角色管理', icon:'peoples' },{ name:'用户管理', icon:'user' },{ name:'部门管理', icon:'tree' },{ name:'岗位管理', icon:'post' },{ name:'参数设置', icon:'system' }],
  2000: [{ name:'设备列表', icon:'list' },{ name:'设备拓扑', icon:'tree-table' },{ name:'心跳日志', icon:'online' },{ name:'故障预警', icon:'bug' },{ name:'SNMP管理', icon:'monitor' },{ name:'维修工单', icon:'build' },{ name:'配件管理', icon:'component' }],
  2009: [{ name:'人员通行设备', icon:'lock' },{ name:'通行权限管理', icon:'edit' },{ name:'车辆通行设备', icon:'guide' },{ name:'车辆通行权限', icon:'edit' },{ name:'监控设备管理', icon:'camera' },{ name:'视频预览', icon:'video-play' },{ name:'地图模式', icon:'location' }],
  2004: [{ name:'访客预约', icon:'date-range' },{ name:'访客审批', icon:'edit' },{ name:'现场登记', icon:'form' },{ name:'来访记录', icon:'log' }],
  2021: [{ name:'数据对接', icon:'upload' },{ name:'考勤数据', icon:'chart' }],
  2:    [{ name:'操作日志', icon:'documentation' },{ name:'登录日志', icon:'logininfor' },{ name:'数据监控', icon:'monitor' },{ name:'缓存列表', icon:'redis-list' }],
  2132: [{ name:'渠道管理', icon:'component' },{ name:'签名模板', icon:'edit' },{ name:'业务配置', icon:'build' },{ name:'黑名单', icon:'lock' },{ name:'定时任务', icon:'time' },{ name:'发送日志', icon:'log' }],
  2031: [{ name:'会议室管理', icon:'build' },{ name:'会议预约', icon:'date-range' },{ name:'会议管理', icon:'list' },{ name:'预约审批', icon:'edit' }],
  2113: [{ name:'公寓管理', icon:'build' },{ name:'房间管理', icon:'tab' },{ name:'房间卡片', icon:'list' },{ name:'租客管理', icon:'people' }],
  2100: [{ name:'通知公告', icon:'bell' }],
};

let currentModule = null;

// ====== 渲染 ======
function renderCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = modules.map(m => `
    <div class="module-card" style="background:${m.color}10;" onclick="enterModule(${m.pid})">
      <div class="card-pattern ${m.pattern}"></div>
      <div class="card-title">${m.name}</div>
      <div class="card-sub">${m.sub}</div>
    </div>
  `).join('');
}

function renderSidebar(pid) {
  const menu = document.getElementById('sidebarMenu');
  const back = document.getElementById('backBtn');
  if (pid === null) {
    // 首页：显示空
    menu.innerHTML = '';
    back.classList.remove('show');
    document.getElementById('topbarTitle').textContent = '首页';
  } else {
    const mod = modules.find(m => m.pid === pid);
    const items = subMenus[pid] || [];
    menu.innerHTML = `
      <div class="menu-group">
        <div class="menu-group-title">${mod ? mod.name : ''}</div>
        ${items.map((s,i) => `
          <div class="menu-item ${i===0?'active':''}">
            <span class="sub-icon"></span> ${s.name}
          </div>
        `).join('')}
      </div>
    `;
    back.classList.add('show');
    document.getElementById('topbarTitle').textContent = mod ? mod.name : '';
  }
}

function enterModule(pid) {
  currentModule = pid;
  const mod = modules.find(m => m.pid === pid);
  document.getElementById('portal').style.display = 'none';
  document.getElementById('portal').classList.remove('active');
  const mp = document.getElementById('modulePage');
  mp.style.display = 'block';
  document.getElementById('modTitle').textContent = mod.name;
  document.getElementById('modBreadcrumb').textContent = `首页 / ${mod.name}`;
  document.getElementById('modPlaceholder').innerHTML = `此处为【${mod.name}】模块的列表页面<br>（实际部署后跳转到 ${mod.path}/ 下的真实页面，侧边栏仅显示该模块子菜单）`;
  renderSidebar(pid);
}

function goHome() {
  currentModule = null;
  document.getElementById('portal').style.display = 'block';
  document.getElementById('portal').classList.add('active');
  document.getElementById('modulePage').style.display = 'none';
  renderSidebar(null);
}

// ====== 初始化 ======
renderCards();
renderSidebar(null);
</script>
</body>
</html>
